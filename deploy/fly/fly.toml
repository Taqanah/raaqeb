# Raaqeb on Fly.io, a sample: one machine, Fly's proxy in front for TLS.
# The steps, and why each line is here, are in README.md beside this file.
# Replace every <...> before the first deploy.
app = "<app>"
primary_region = "<region>"

[build]
  # The image `bun run image` loads, deployed with `fly deploy --local-only --ha=false`;
  # it is also the name a release publishes.
  image = "ghcr.io/taqanah/raaqeb:0.1.0"

[env]
  # Fly's proxy connects from inside 172.16.0.0/12 and appends the app's own
  # address, the one the visitor reached, as the last hop of X-Forwarded-For.
  # Both from `fly ips list`.
  RAAQEB_TRUSTED_PROXIES = "172.16.0.0/12,<the app's IPv4>,<the app's IPv6>"

[http_service]
  internal_port = 3000
  force_https = true
  # A stopped machine runs no checks: keep exactly one running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Raaqeb speaks HTTP/2 with prior knowledge beside HTTP/1.1, so the proxy
  # multiplexes its requests to the machine on one connection.
  [http_service.http_options]
    h2_backend = true

  # Fly ignores the image's Docker HEALTHCHECK; this is the same endpoint.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# On SQLite the data directory holds everything, so it needs a volume.
# On Postgres, with DATABASE_URL and RAAQEB_SECRET_KEY as Fly secrets,
# delete these three lines: nothing else is written there.
[mounts]
  source = "raaqeb_data"
  destination = "/data"

[[vm]]
  cpus = 1
  memory_mb = 256
