# Moves the image's X.Y and latest tags to a release when it is published as a
# stable one. A pre-release never moves them, so a pull of latest stays on the
# newest stable version.
name: Promote

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  promote:
    name: Tag the image X.Y and latest
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # imagetools copies the manifest list, attestations included, without pulling the image.
      - name: Add the tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          case "$version" in
            *[!0-9.]*) echo "::error::$TAG is not a stable version"; exit 1 ;;
          esac
          image=ghcr.io/taqanah/raaqeb
          docker buildx imagetools create --tag "$image:${version%.*}" --tag "$image:latest" "$image:$version"
