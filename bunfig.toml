# Every node-shebang bin in node_modules/.bin runs on Bun, not Node.
[run]
bun = true

# A release younger than three days is held back: a hijacked npm version is usually caught and pulled within that window.
[install]
minimumReleaseAge = 259200 # 3 days in seconds; the "3d" form breaks every command on Bun 1.4.3 and older
